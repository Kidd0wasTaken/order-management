services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orders_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orders_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  dukintegrator:
    build: ./backend/dukintegrator
    environment:
      DUK_JAR_PATH: /opt/duk/dist/DUKIntegrator.jar
    volumes:
      - d100_exports:/exports
      - ./backend/dukintegrator/jar:/opt/duk
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  backend:
    build: ./backend
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=orders_db;Username=postgres;Password=postgres
      D100__DukIntegratorUrl: http://dukintegrator:8080
      D100__ExportRoot: /exports
    ports:
      - "5000:5000"
    volumes:
      - d100_exports:/exports
    depends_on:
      db:
        condition: service_healthy
      dukintegrator:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  d100_exports:
